<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Typeface — Home</title>
<link rel="stylesheet" href="../typeface-ds.css?v=72">
<script src="_shell.js?v=72"></script>
</head>
<body data-nav="Home" data-chrome="off">

<main class="tf-main" style="padding:0;background:var(--tf-surface)">
  <div class="tf-home">

    <div class="tf-hero">
      <h1>What will you create today?</h1>
      <div class="tf-prompt">
        <span class="mk">l</span>
        <input placeholder="What do you want to create?" readonly>
      </div>
    </div>

    <section class="tf-homesec">
      <header>
        <h2>Start creating</h2>
        <div class="spacer"></div>
        <button class="tf-arrow">‹</button>
        <button class="tf-arrow">›</button>
      </header>
      <div class="tf-startrow">
        <div class="tf-start">
          <div class="thumb" style="background:#CFE0EC"><div class="page"></div></div>
          <b>Blog post</b>
        </div>
        <div class="tf-start">
          <div class="thumb" style="background:#F3D6E2"><div class="page" style="width:52%;background:#E8A33D"></div></div>
          <b>Image studio</b>
        </div>
        <div class="tf-start">
          <div class="thumb" style="background:#D9E3D6"><div class="page" style="width:72%;height:60%;background:#2E3B33"></div></div>
          <b>Repurpose web content</b>
        </div>
        <div class="tf-start">
          <div class="thumb" style="background:#DCDAEC"><div class="page" style="width:56%"></div></div>
          <b>Social post</b>
        </div>
        <a class="tf-start" href="01-brief.html" style="text-decoration:none;color:inherit">
          <div class="thumb" style="background:#EFD9CE"><div class="page" style="width:60%"></div></div>
          <b>Design asset</b>
        </a>
      </div>
    </section>

    <section class="tf-homesec">
      <header>
        <h2>Recent projects</h2>
        <div class="spacer"></div>
        <a class="tf-seeall">See all</a>
      </header>
      <div class="tf-projects">
        <a class="tf-project" href="20-arc-canvas.html" style="text-decoration:none;color:inherit">
          <div class="prev"><div style="width:56%;height:76%;background:#fff;border:1px solid var(--tf-line);border-radius:2px"></div></div>
          <div class="meta"><div><b>Spring Trail Campaign</b><span>Edited 1 hour ago</span></div><span class="kebab">⋮</span></div>
        </a>
        <div class="tf-project">
          <div class="prev" style="background:#E8EDF2"><div style="width:60%;height:70%;background:linear-gradient(135deg,#2E5D8C,#0E1B33);border-radius:2px"></div></div>
          <div class="meta"><div><b>Peak 2 Launch</b><span>Edited 12 hours ago</span></div><span class="kebab">⋮</span></div>
        </div>
        <div class="tf-project">
          <div class="prev"><div style="width:56%;height:76%;background:#fff;border:1px solid var(--tf-line);border-radius:2px"></div></div>
          <div class="meta"><div><b>Q1 Performance Recap</b><span>Edited yesterday</span></div><span class="kebab">⋮</span></div>
        </div>
        <div class="tf-project">
          <div class="prev" style="background:#F6F3EE">
            <div style="font-family:var(--brand-display);font-weight:800;color:var(--brand-primary);font-size:19px;letter-spacing:.02em">MERIDIAN</div>
          </div>
          <div class="meta"><div><b>Brand Kit</b><span>Edited 22 days ago</span></div><span class="kebab">⋮</span></div>
        </div>
      </div>
    </section>

  </div>
  <button class="tf-fab">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 12.5a2 2 0 0 1-2 2H7l-4 3v-12a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  </button>
</main>
</body>
</html>
